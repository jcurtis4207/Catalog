<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Edit/Delete Book</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="title-container">
        <div id="title">
            <h1>Edit/Delete Book</h1>
        </div>
    </div>
    <div id="form-container">
        <form method="POST" action="{{ url_for('process_edit_book') }}">
            <table id="book-form">
                <tr>
                    <td>ISBN</td>
                    <td><input type="text" name="ISBN" value="{{ book[0] }}" readonly></td>
                </tr>
                <tr>
                    <td>Title</td>
                    <td><input type="text" name="Title" value="{{ book[1] }}"></td>
                </tr>
                <tr>
                    <td>Author</td>
                    <td><input type="text" name="Author" value="{{ book[2] }}"></td>
                </tr>
                <tr>
                    <td><a href="https://catalog.loc.gov/vwebv/ui/en_US/htdocs/help/searchBrowse.html" target="_blank">LCNo</a></td>
                    <td><input type="text" name="LCNo" value="{{ book[3] }}"></td>
                </tr>
                <tr>
                    <td>Year</td>
                    <td><input type="text" name="Year" value="{{ book[4] }}"></td>
                </tr>
                <tr>
                    <td>Unread</td>
                    <td><input type="checkbox" name="Read" {{ book[5] }}></td>
                </tr>
                <tr>
                    <td>Genre</td>
                    <td><input type="text" name="Genre" value="{{ book[6] }}"></td>
                </tr>
            </table>
            <input type="submit" value="Submit" id="submit">
        </form>
        <button id="delete_button" onclick="if(confirm('Are you sure you want to delete this book?')){
            window.location.href='{{ url_for('delete_book', isbn=book[0]) }}'}">Delete Book</button>
        <button id="home_button" onclick="window.location.href='/'">Return Home</button>
    </div>
</body>
</html>
